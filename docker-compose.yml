# ── Полный стек: PostgreSQL + Redis + бот (+ опционально MinIO для бэкапов) ──
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: couple
      POSTGRES_PASSWORD: couple
      POSTGRES_DB: couple_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couple -d couple_bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COUPLE_BOT_POSTGRES_DSN: postgresql+asyncpg://couple:couple@postgres:5432/couple_bot
      COUPLE_BOT_REDIS_DSN: redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./generated:/app/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Миграции запускаются отдельно (см. README):
  #     docker compose run --rm bot alembic upgrade head
  # ──────────────────────────────────────────────────────

  # ── Опционально: S3-совместимое хранилище для бэкапов (MinIO) ──
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles: ["backup"]

  # ── Опционально: ежедневный pg_dump -> S3 ──
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: couple
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: couple-bot-backups
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache wget >/dev/null
        wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
        chmod +x /usr/local/bin/mc
        echo "0 3 * * * /backup.sh" > /etc/crontabs/root
        crond -f -l 2
    depends_on:
      - postgres
      - minio
    profiles: ["backup"]

volumes:
  pgdata:
  redisdata:
  miniodata:
